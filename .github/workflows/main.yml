name: Frontend CI-CD Process

on:
  push:
    branches: [ main ]  # يشتغل الـ Pipeline كل ما تعمل Push لفرع main
  pull_request:
    branches: [ main ]  # يشتغل أيضاً عند فتح طلب دمج (PR) للتأكد من سلامة الكود

jobs:
  build-process:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من GitHub إلى سيرفر العمل
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت بيئة Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # تأكد أنها نفس النسخة اللي بجهازك
          cache: 'npm'       # لتسريع العملية في المرات القادمة

      # 3. تثبيت المكتبات (Packages)
      - name: Install Dependencies
        run: npm install

      # 4. بناء المشروع (التأكد أن الـ Build ناجح)
      - name: Build Project
        run: npm run build

      # 5. خطوة اختيارية: فحص جودة الكود (Linting)
      - name: Run Lint
        run: npm run lint || echo "No lint script found"
