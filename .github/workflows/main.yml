name: Frontend CI-CD with Testing

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # تحديد مكان ملف الـ lock للتخزين المؤقت
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        # نستخدم الـ working-directory لإخبار الأكشن بالدخول لمجلد frontend
        working-directory: ./frontend
        run: npm install

      - name: Run Tests
        working-directory: ./frontend
        # إضافة --run لضمان أن Vitest لا يدخل في الـ Watch mode داخل السيرفر
        run: npx vitest run 

      - name: Build Project
        working-directory: ./frontend
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # في Next.js، المجلد الناتج عن Build يكون عادة .next أو out 
          # إذا كنت تستخدم static export استخدم 'out'
          publish_dir: ./frontend/out