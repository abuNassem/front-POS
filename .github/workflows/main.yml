name: Frontend CI-CD with Testing

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      # --- مرحلة الاختبار (CI) ---
      - name: Run Tests
        run: npm test # سيقوم بتشغيل الاختبارات الموجودة في مشروعك
        # ملاحظة: إذا فشل أي اختبار هنا، لن ينتقل للخطوات التالية

      - name: Build Project
        run: npm run build

      # --- مرحلة الرفع (CD) ---
      # هذه الخطوة لن تعمل إلا إذا نجح الـ Build والـ Test
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # تأكد إذا كان مجلد الـ build في مشروعك اسمه dist أو build