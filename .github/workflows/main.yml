name: Frontend CI-CD with Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # حذفنا frontend/ لأننا في الجذر الآن
          cache-dependency-path: ./package-lock.json

      - name: Install Dependencies
        # حذفنا working-directory لأننا في المكان الصحيح
        run: npm install

      - name: Run Tests
        run: npm test -- --run 
        
      - name: Build Project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # إذا كان المشروع Next.js وتستخدم static export، المجلد سيكون out
          # إذا كان React عادي (Vite) المجلد يكون dist
          publish_dir: ./out